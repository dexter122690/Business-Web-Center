<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request an appointment</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f5f3;color:#201a17;font-family:Arial,sans-serif}.card{width:min(680px,calc(100% - 40px));box-sizing:border-box;background:#fff;border:1px solid #eadbd4;border-radius:18px;padding:32px;box-shadow:0 18px 48px #38261a12}.k{color:#ff5219;letter-spacing:2px;font-size:11px;font-weight:700}h1{margin:7px 0 10px;font-size:28px}p{color:#6f5b53;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:700}input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;border:1px solid #d8c7bf;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:86px;resize:vertical}.full{grid-column:1/-1}button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:14px;background:#ff5219;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.message{margin-top:14px;padding:12px;border-radius:9px;background:#fff0eb;color:#a63a1a}.hide{display:none}@media(max-width:580px){.card{padding:22px}.grid{grid-template-columns:1fr}}</style></head>
<body><main class="card"><div class="k">APPOINTMENT REQUEST</div><h1>Book your service appointment</h1><p>Send your preferred date and unit details. This request goes directly to the selected business branch.</p><form id="form"><div class="grid"><label>Preferred date *<input id="date" type="date" required></label><label>Preferred time<input id="time" type="time"></label><label>Full name *<input id="client" required placeholder="Your name"></label><label>Contact number *<input id="contact" required placeholder="Mobile number"></label><label>Vehicle / unit *<input id="vehicle" required placeholder="e.g., Toyota Vios"></label><label>Year model<input id="year" placeholder="e.g., 2023"></label><label>Color<input id="color" placeholder="e.g., Pearl white"></label><label>Procedure needed<input id="procedure" placeholder="e.g., Full wash-over"></label><label class="full">Appointment choice *<select id="response" required><option value="confirmed">Confirmed — I will come on this date</option><option value="call">Please call me first</option><option value="visit">I will visit at this date</option></select></label><label class="full">Notes<textarea id="notes" placeholder="Optional details or preferred schedule"></textarea></label></div><button id="submit" type="submit">Send appointment request</button></form><div id="message" class="message hide"></div></main>
<script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){var token=new URLSearchParams(location.search).get('token'),config=window.BUSINESS_WEB_CENTER_SUPABASE||{},form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('submit');function say(text){message.textContent=text;message.classList.remove('hide')}if(!token){form.remove();return say('This appointment link is incomplete. Please ask the business for a new link.')}if(!config.url||!config.publishableKey){form.remove();return say('Online appointments are not configured yet.')}var db=window.supabase.createClient(config.url,config.publishableKey);form.onsubmit=async function(event){event.preventDefault();button.disabled=true;button.textContent='Sending…';var result=await db.rpc('submit_public_appointment',{p_token:token,p_scheduled_date:document.getElementById('date').value,p_scheduled_time:document.getElementById('time').value||null,p_client_name:document.getElementById('client').value.trim(),p_contact_number:document.getElementById('contact').value.trim(),p_vehicle:document.getElementById('vehicle').value.trim(),p_year_model:document.getElementById('year').value.trim()||null,p_color:document.getElementById('color').value.trim()||null,p_procedure:document.getElementById('procedure').value.trim()||null,p_notes:document.getElementById('notes').value.trim()||null,p_response:document.getElementById('response').value});button.disabled=false;button.textContent='Send appointment request';if(result.error)return say(result.error.message);form.reset();say('Thank you. Your appointment request was sent to the business.');};})();</script></body></html>
