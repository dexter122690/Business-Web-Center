<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an appointment</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f5f3;color:#201a17;font:16px Arial,sans-serif}.card{width:min(520px,calc(100% - 40px));box-sizing:border-box;border:1px solid #eadbd4;border-radius:18px;background:#fff;padding:32px;text-align:center}.k{color:#ff5219;letter-spacing:2px;font-weight:bold;font-size:11px}h1{margin:8px 0}.muted{color:#6f5b53;line-height:1.5}</style></head><body><main class="card"><div class="k">APPOINTMENT REQUEST</div><h1>Opening booking form…</h1><p class="muted" id="message">Please wait a moment.</p></main><script src="../app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){var code=new URLSearchParams(location.search).get('code')||location.pathname.split('/').filter(Boolean).pop(),message=document.getElementById('message'),config=window.BUSINESS_WEB_CENTER_SUPABASE||{};if(!code||code==='book'||code==='index.html'){message.textContent='This booking link is incomplete. Please ask the business for a new link.';return}if(!config.url||!config.publishableKey){message.textContent='Online booking is not configured yet.';return}var db=window.supabase.createClient(config.url,config.publishableKey);db.rpc('get_public_appointment_token',{p_short_code:code}).then(function(result){if(result.error||!result.data){message.textContent=result.error?result.error.message:'This booking link is no longer active.';return}location.replace('/appointment.html?token='+encodeURIComponent(result.data))})})();</script></body></html>
