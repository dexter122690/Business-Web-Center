<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share feedback</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f5f3;color:#201a17;font-family:Arial,sans-serif}.card{width:min(520px,calc(100% - 40px));box-sizing:border-box;background:#fff;border:1px solid #eadbd4;border-radius:18px;padding:32px;box-shadow:0 18px 48px #38261a12}.k{color:#ff5219;letter-spacing:2px;font-size:11px;font-weight:700}h1{margin:7px 0 10px;font-size:28px}p{color:#6f5b53;line-height:1.5}textarea{width:100%;min-height:130px;box-sizing:border-box;border:1px solid #d8c7bf;border-radius:10px;padding:12px;font:inherit;resize:vertical}button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:14px;background:#ff5219;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.message{margin-top:14px;padding:12px;border-radius:9px;background:#fff0eb;color:#a63a1a}.hide{display:none}</style></head>
<body><main class="card"><div class="k">ANONYMOUS CLIENT FEEDBACK</div><h1>Tell us about your experience</h1><p>Your feedback is shared directly with this business. Please do not include sensitive personal information.</p><form id="form"><textarea id="feedback" required placeholder="Write your feedback here..."></textarea><button id="submit" type="submit">Submit feedback</button></form><div id="message" class="message hide"></div></main>
<script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){var token=new URLSearchParams(location.search).get('token'),config=window.BUSINESS_WEB_CENTER_SUPABASE||{},form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('submit');function say(text){message.textContent=text;message.classList.remove('hide')}if(!token){form.remove();return say('This feedback link is incomplete. Please scan the shop QR code again.')}if(!config.url||!config.publishableKey){form.remove();return say('Feedback is not configured yet.')}var db=window.supabase.createClient(config.url,config.publishableKey);form.onsubmit=async function(event){event.preventDefault();var text=document.getElementById('feedback').value.trim();if(!text)return;button.disabled=true;button.textContent='Sending…';var result=await db.rpc('submit_public_feedback',{p_token:token,p_feedback:text});button.disabled=false;button.textContent='Submit feedback';if(result.error)return say(result.error.message);form.reset();say('Thank you. Your feedback has been submitted.');};})();</script></body></html>
